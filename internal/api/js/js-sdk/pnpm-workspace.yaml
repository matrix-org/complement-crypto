packages:
  - "."

allowBuilds:
  # Needed for `vite` to build, since esbuild's postinstall downloads and links
  # a platform-specific binary.
  esbuild: true
  # Needed for CI to install the SDK from a git URL, since pnpm must run its
  # prepare script to build it from source.
  "matrix-js-sdk@git+https://github.com/matrix-org/matrix-js-sdk.git": true
